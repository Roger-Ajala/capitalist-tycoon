services:
  postgres:
    image: postgres:16-alpine
    container_name: tycoon-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: tycoon_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: